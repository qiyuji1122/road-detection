# 道路病害目标检测数据集配置
# 数据集路径（使用绝对路径，避免出错）
path: /Users/qiyuji/Documents/道路目标检测YOLOv11/dataset_rdd_5k/
train: train/images    # 训练图片相对路径
val: val/images        # 验证图片相对路径
